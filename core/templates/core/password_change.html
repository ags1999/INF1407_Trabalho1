{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2>Alterar Senha</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-warning w-100">Salvar Nova Senha</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'core:profile' %}" class="small">Cancelar e Voltar</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
