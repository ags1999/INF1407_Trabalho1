{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2>Configurações de Perfil</h2>
                <p class="text-muted">E-mail: {{ user.email }}</p>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Atualizar Nome de Usuário</button>
                </form>
                
                <hr>
                
                <div class="d-grid gap-2">
                    <a href="{% url 'core:password_change' %}" class="btn btn-outline-warning">Alterar Senha</a>
                    <a href="{% url 'core:home' %}" class="btn btn-link">Voltar para Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
